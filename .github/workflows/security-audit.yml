# H4: Supply Chain Security - Weekly Security Audit
name: Security Audit

on:
  # Run weekly on Sunday at midnight
  schedule:
    - cron: '0 0 * * 0'
  # Allow manual trigger
  workflow_dispatch:
  # Run on PRs to main
  pull_request:
    branches: [main]

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner (Rust)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        env:
          TRIVY_DB_REPOSITORY: 'ghcr.io/aquasecurity/trivy-db:2'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
      
      - name: Check for critical vulnerabilities
        run: |
          # Extract critical and high severity issues
          if grep -q '"Severity": "CRITICAL"' trivy-results.sarif 2>/dev/null || \
             grep -q '"Severity": "HIGH"' trivy-results.sarif 2>/dev/null; then
            echo "⚠️ Security vulnerabilities found!"
            echo "Please review the Security tab for details."
            exit 1
          else
            echo "✅ No critical or high vulnerabilities found"
          fi

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check Cargo.lock is up to date (Rust)
        working-directory: ./core
        run: |
          cargo update --locked 2>&1 || true
          if [ -f Cargo.lock ]; then
            git diff --quiet Cargo.lock || {
              echo "❌ Cargo.lock is out of date. Run 'cargo update --locked' and commit."
              exit 1
            }
          fi
      
      - name: Check package-lock.json is up to date (Node)
        working-directory: ./ui
        run: |
          npm install --package-lock-only 2>&1 || true
          if [ -f package-lock.json ]; then
            git diff --quiet package-lock.json || {
              echo "❌ package-lock.json is out of date. Run 'npm install' and commit."
              exit 1
            }
          fi
      
      - name: Check poetry.lock is up to date (Python)
        working-directory: ./execution
        run: |
          poetry lock --no-update 2>&1 || true
          if [ -f poetry.lock ]; then
            git diff --quiet poetry.lock || {
              echo "❌ poetry.lock is out of date. Run 'poetry lock' and commit."
              exit 1
            }
          fi

  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          base: ${{ github.event.repository.default_branch }}
          head: ${{ github.head_ref }}
          extraArgs: --only-verified
