name: Phase 3 Smoke Tests
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  phase3-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker
        uses: docker/setup-docker-action@v3
        
      - name: Docker Compose config test
        run: docker-compose -f docker-compose.prod.yml config
        
      - name: Build prod images
        run: |
          docker-compose -f docker-compose.prod.yml build
          
      - name: Bring up prod stack
        run: |
          docker-compose -f docker-compose.prod.yml up -d db
          sleep 20
          docker-compose -f docker-compose.prod.yml up -d
          sleep 40
          
      - name: Wait for services
        run: |
          echo "Waiting for services to be healthy..."
          docker-compose -f docker-compose.prod.yml ps
          
      - name: Run prod smoke tests
        run: |
          bash scripts/prod_smoke.sh
        continue-on-error: true
        
      - name: Collect smoke results
        run: |
          echo "Phase 3 Smoke Test Results" > phase3_smoke_report.txt
          echo "========================" >> phase3_smoke_report.txt
          date >> phase3_smoke_report.txt
          docker-compose -f docker-compose.prod.yml ps >> phase3_smoke_report.txt 2>&1
          echo "" >> phase3_smoke_report.txt
          echo "Health Status:" >> phase3_smoke_report.txt
          curl -sf http://localhost:3000/health >> phase3_smoke_report.txt 2>&1 || echo "Router health check failed" >> phase3_smoke_report.txt
          curl -sf http://localhost:3001/health >> phase3_smoke_report.txt 2>&1 || echo "UI health check failed" >> phase3_smoke_report.txt
          cat phase3_smoke_report.txt
          
      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: phase3-smoke-artifacts
          path: phase3_smoke_report.txt
          
      - name: Tear down prod stack
        if: always()
        run: |
          docker-compose -f docker-compose.prod.yml down -v