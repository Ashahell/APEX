version: '3.8'
services:
  router:
    image: apex-router-prod:latest
    container_name: apex_router_prod
    restart: unless-stopped
    read_only: true
    user: "1000:1000"
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=10m,mode=1777
      - /var/run:size=10m,mode=1777
    mem_limit: 512m
    cpus: 0.5
    environment:
      - APEX_ENV=production
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  ui:
    image: apex-ui-prod:latest
    container_name: apex_ui_prod
    restart: unless-stopped
    read_only: true
    user: "1000:1000"
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=10m,mode=1777
      - /var/run:size=10m,mode=1777
    mem_limit: 256m
    cpus: 0.25
    environment:
      - NODE_ENV=production
    expose:
      - "80"
    depends_on:
      - router
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  db:
    image: postgres:15
    container_name: apex_db_prod
    restart: unless-stopped
    user: "999:999"
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    volumes:
      - apex_db_data:/var/lib/postgresql/data
    mem_limit: 1g
    cpus: 1.0
    environment:
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
      - POSTGRES_USER=apex
      - POSTGRES_DB=apex
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apex -d apex || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    secrets:
      - db_password
  nginx:
    image: nginx:alpine
    container_name: apex_nginx_prod
    restart: unless-stopped
    read_only: true
    user: "101:101"
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=5m,mode=1777
      - /var/run:size=5m,mode=1777
    mem_limit: 64m
    cpus: 0.1
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - router
      - ui
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  apex_db_data:
    driver: local
secrets:
  db_password:
    file: ./secrets/db_password.txt